<style>
:root{--bg:#f6f5ef;--fg:#1d211e;--mut:#6b726c;--card:#fff;--acc:#d9a900;--ac2:#1d211e;--line:#e2e4dc;--bad:#c4553a;--good:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161815;--fg:#ebeee8;--mut:#9aa196;--card:#232622;--acc:#f2c200;--ac2:#161815;--line:#32362f;--bad:#e07a5f;--good:#4fbf86}}
:root[data-theme="dark"]{--bg:#161815;--fg:#ebeee8;--mut:#9aa196;--card:#232622;--acc:#f2c200;--ac2:#161815;--line:#32362f;--bad:#e07a5f;--good:#4fbf86}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:0 0 6px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hd b{font-size:15px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;margin:0;padding:9px 2px;font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:9px 12px;background:var(--acc);color:var(--ac2);font-weight:600;margin:6px 6px 0 0}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--mut);font-weight:400}
button.on{background:var(--fg);color:var(--bg)}
button:disabled{opacity:.35}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.r{min-width:34px;text-align:center;font-weight:700;border-radius:7px;padding:2px 0;color:#fff;font-size:15px}
.n{flex:1;min-width:0}.n small{display:block;color:var(--mut);font-size:12px}
.row button{margin:0;padding:6px 10px;font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.me{background:color-mix(in srgb,var(--acc) 25%,transparent);font-weight:700}
.g{color:var(--good)}.b{color:var(--bad)}
</style></head><body><main><div id="g"></div></main>
